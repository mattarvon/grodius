# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.
#
# Grodius has no engine: TypeScript + Canvas 2D + Vite + Capacitor (Android).
# engine.name is deliberately UNSET — its only valid values are Godot | Unity |
# Unreal, and any of them would mis-route specialists and the code root.
# Specialists and commands below are set explicitly instead (decision D5,
# production/decision-log.md).
#
# Do NOT add the six knobs `modes.rigor` fronts (`modes.review_mode`,
# `modes.workflow`, `docs.density`, `qa.level`, `modes.story_granularity`,
# `team.size`): seeding any of them pins that value and shadows the rigor
# expansion. Per-developer preferences belong in `project.local.yaml`.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

project:
  name: "Grodius"
  genre: "Horizontal shoot-'em-up (body horror)"
  version: "0.2.0"
  stage: Production
  kind: game

modes:
  rigor: minimal
  automation: guided
  automation_always_ask:
    - scope_changes
    - file_deletions
    - schema_changes
    - architecture_decisions

testing:
  framework: vitest
  strict:
    logic: true
    integration: false
    visual: false
    ui: false
    config: false

platform:
  multiplayer: false
  online: false
  targets: [Web, Mobile]
  primary_input: "Keyboard"
  gamepad_support: "None"
  touch_support: "Full"
  cert_tier: none

engine:
  language: "TypeScript"
  rendering: "Canvas 2D"

specialists:
  code: "web-specialist"
  shader: "web-specialist"
  ui: "web-specialist"
  additional: []

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE
  signals: on_event_name
  files: snake_case        # src/ files are lowercase single words (shipform.ts); tools/ use kebab-case
  scenes: snake_case

cadence:
  sprint_length: "2w"

performance:
  target_framerate: 60
  frame_budget_ms: 16.7
  draw_call_limit: null
  memory_ceiling_mb: null
  enforce: off             # no on-device baseline yet (decision D15)

commands:
  build: "npm run build"
  run: "npm run dev"
  test: "npm test"
  smoke: "npm run typecheck && npm run build && npm run test:regress"

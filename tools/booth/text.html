<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>booth text frame</title></head>
<body>
<!-- The booth's hidden text frame (LS2-booth): the game modules expect the game page's DOM at import time
     (core.ts reads #c, #wrap, #crt, #pw, #ps), so this frame carries the same skeleton, imports them and posts the
     line text up to tools/booth/booth.html. Kept in its own frame so the game's input listeners and its HMR reloads
     stay out of the booth. -->
<div id="wrap" hidden>
  <canvas id="c" width="480" height="270"></canvas>
  <div id="crt"></div>
  <button id="pw" hidden></button>
  <button id="ps" hidden></button>
</div>
<script type="module" src="/tools/booth/text.ts"></script>
</body>
</html>

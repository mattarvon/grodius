<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grodius Voice Booth</title>
<meta name="booth-token" content="%BOOTH_TOKEN%">
<!-- The voice booth (LS2-booth, tools/booth/README.md). Dev server only: tools/booth/plugin.ts serves it. -->
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0809; --panel: #160d0f; --line: #2a1a1d; --line2: #4a2a2f;
    --ink: #e6dcdc; --dim: #8a98a8; --red: #ff4a5a; --ok: #6fd08c; --warn: #e8b34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; color: var(--red); letter-spacing: .04em; }
  header label { color: var(--dim); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  select, button { background: #2a1a1d; color: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.rec { background: #5a1018; border-color: var(--red); }
  button.on { background: var(--red); color: #000; }
  .meter { width: 160px; height: 10px; background: #000; border: 1px solid var(--line2); border-radius: 5px; overflow: hidden; }
  /* the gradient is sized to the track, not the bar, so red shows only when the level reaches it */
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok) 70%, var(--warn) 85%, var(--red)) 0 0 / 160px 100% no-repeat; }
  .clip { font-size: 11px; font-weight: 800; color: #000; background: var(--red); border-radius: 4px; padding: 0 5px; visibility: hidden; }
  .clip.on { visibility: visible; }
  .hint { color: var(--warn); font-size: 12px; }
  #stage.rec { box-shadow: inset 0 0 0 3px var(--red); }
  .recdot { color: var(--red); font-weight: 800; letter-spacing: .1em; }
  .warn { color: var(--warn); }
  .who { display: flex; gap: 12px; align-items: center; }
  .face { width: 96px; height: 104px; image-rendering: pixelated; background-repeat: no-repeat; border: 1px solid var(--line2); background-color: #000; flex: none; }
  .peak { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; min-width: 56px; }
  main { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; min-height: calc(100vh - 54px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  #slots { border-right: 1px solid var(--line); overflow-y: auto; }
  .slot { padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .slot.sel { background: #24121a; box-shadow: inset 3px 0 var(--red); }
  .slot .t { font-weight: 600; letter-spacing: .03em; }
  .slot .m { color: var(--dim); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line2); }
  .tag.w { color: var(--ok); border-color: #2f5a3b; }
  .tag.nw { color: var(--warn); border-color: #5a4a2a; }
  #stage { padding: 20px 24px; }
  .line { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: .04em; margin: 6px 0 4px; }
  .caller { color: var(--red); font-size: 13px; letter-spacing: .08em; }
  .when { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .state { color: var(--dim); font-size: 13px; }
  .state.err { color: var(--red); }
  audio { height: 32px; }
  h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 22px 0 6px; }
  .take { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; font-family: ui-monospace, monospace; }
  .keys { color: var(--dim); font-size: 12px; margin-top: 26px; }
  kbd { border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>GRODIUS VOICE BOOTH</h1>
  <label>Mic <select id="mic"><option>(allow the mic)</option></select></label>
  <div class="meter" title="input level"><i id="lvl"></i></div>
  <span class="peak" id="pk">-inf dB</span>
  <span class="clip" id="clip" aria-hidden="true">CLIP</span>
  <span class="hint" id="hint"></span>
</header>
<main>
  <nav id="slots" role="listbox" aria-label="voice lines"></nav>
  <section id="stage"><div id="view"></div><div id="status" role="status" aria-live="polite" class="state"></div><div id="takes"></div></section>
</main>
<iframe id="textframe" src="/tools/booth/text.html" hidden title="game text"></iframe>
<script type="module" src="/tools/booth/booth.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grodius Voice Booth</title>
<meta name="booth-token" content="%BOOTH_TOKEN%">
<!-- The voice booth (LS2-booth, tools/booth/README.md). Dev server only: tools/booth/plugin.ts serves it. -->
<!-- the game's own faces (fontsource), as plain stylesheets: a CSS import in booth.ts would pull in the Vite client -->
<link rel="stylesheet" href="/node_modules/@fontsource/silkscreen/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/grenze-gotisch/900.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #070405; --bg2: #0d0708; --panel: #130a0c; --panel2: #1a0e11; --line: #2a1519; --line2: #4a232a;
    --ink: #ece2e2; --dim: #9a8a8e; --mute: #6a5a5e; --red: #ff3b4e; --blood: #8a0f1e; --ok: #6fd08c; --warn: #e8b34a;
    --hud: Silkscreen, "Courier New", ui-monospace, monospace; --disp: "Grenze Gotisch", Georgia, serif;
    --r: 6px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 500px at 70% -200px, #2a060c 0%, transparent 70%), radial-gradient(800px 600px at -10% 110%, #1a0407 0%, transparent 60%), var(--bg);
    background-attachment: fixed; min-height: 100vh;
  }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #d9c4c7; }
  /* ---------------- header: the title, the mic, the input meter ---------------- */
  header {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: linear-gradient(#170a0d, #0d0607); position: sticky; top: 0; z-index: 5;
    box-shadow: 0 1px 0 #000, 0 6px 18px #0008;
  }
  h1 { margin: 0; font: 900 26px/1 var(--disp); color: var(--red); letter-spacing: .02em; text-shadow: 0 0 14px #ff3b4e55, 0 2px 0 #3a0008; }
  h1 small { font: 400 9px var(--hud); color: var(--dim); letter-spacing: .12em; margin-left: 8px; text-shadow: none; vertical-align: middle; }
  header label { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  select, button, input[type=text], input[type=search] {
    background: linear-gradient(#25141a, #1b0e12); color: var(--ink); border: 1px solid var(--line2); border-radius: var(--r);
    padding: 5px 10px; font: inherit; font-size: 13px;
  }
  select, button { cursor: pointer; }
  button:hover:not(:disabled), select:hover { border-color: #7a3a44; background: linear-gradient(#2e171e, #211015); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; }
  button.rec { background: linear-gradient(#6a0f1c, #3e0710); border-color: var(--red); font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
  button.rec .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 6px var(--red); }
  button.on { background: var(--red); color: #000; }
  button.on .dot { background: #000; box-shadow: none; animation: blink 1s steps(2) infinite; }
  button.hot { border-color: #8a3a44; }
  @keyframes blink { 50% { opacity: .2; } }
  kbd { border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: 10px var(--hud); color: var(--dim); background: #0006; }
  .meterbox { display: flex; flex-direction: column; gap: 2px; }
  .meter { position: relative; width: 220px; height: 12px; background: #000; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 3px #000; }
  /* the target band: the loudest syllable at -10 to -6 dBFS (the meter spans -60 to 0; LS2-booth2, audio-director) */
  .meter b { position: absolute; top: 0; bottom: 0; left: 83.333%; width: 6.667%; border-left: 1px solid #fff8; border-right: 1px solid #fff8; background: #ffffff14; pointer-events: none; z-index: 2; }
  /* the gradient is sized to the track, not the bar, so red shows only when the level reaches it */
  /* green to -6 dBFS, amber -6 to -3, red past -3 */
  .meter i { position: absolute; left: 0; top: 0; display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok) 90%, var(--warn) 90%, var(--warn) 95%, var(--red) 95%) 0 0 / 220px 100% no-repeat; }
  .meter i#rmsb { opacity: .45; filter: saturate(.6); z-index: 1; }
  .meter i#lvl { opacity: .95; height: 50%; top: 25%; }
  /* the peak hold tick */
  .meter s { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 4px #fff; z-index: 3; text-decoration: none; }
  .meter s.off { visibility: hidden; }
  .scale { position: relative; width: 220px; height: 9px; font: 7px var(--hud); color: var(--mute); }
  .scale span { position: absolute; transform: translateX(-50%); }
  .led { font: 9px var(--hud); letter-spacing: .06em; color: #000; border-radius: 3px; padding: 2px 5px; opacity: .14; background: var(--mute); user-select: none; }
  .led.clip { background: var(--red); cursor: pointer; }
  .led.clip.on { opacity: 1; box-shadow: 0 0 10px var(--red); }
  .led.hot { background: var(--warn); }
  .led.hot.on { opacity: 1; box-shadow: 0 0 8px var(--warn); }
  label.opt { color: var(--dim); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--red); }
  .hint { color: var(--warn); font-size: 12px; }
  .peak { font: 10px var(--hud); color: var(--dim); min-width: 64px; }
  .aim { font-size: 11px; color: var(--mute); }
  /* ---------------- the layout ---------------- */
  main { display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); min-height: calc(100vh - 58px); }
  @media (max-width: 900px) { main { grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } #slots { max-height: 40vh; } }
  #slots { border-right: 1px solid var(--line); overflow-y: auto; background: #0a0506cc; max-height: calc(100vh - 58px); position: sticky; top: 58px; }
  @media (max-width: 760px) { #slots { position: static; } }
  .slot { padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .slot:hover { background: #1a0b0f; }
  .slot.sel { background: linear-gradient(90deg, #2c0d15, #160a0d); box-shadow: inset 3px 0 var(--red); }
  .slot .t { font-weight: 700; letter-spacing: .03em; }
  .slot .m { color: var(--dim); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line2); }
  .tag.w { color: var(--ok); border-color: #2f5a3b; }
  .tag.nw { color: var(--warn); border-color: #5a4a2a; }
  /* min-width 0: a wide row (a take with a long rack name) must wrap, not widen the grid column past the window */
  #stage { padding: 16px 22px 40px; min-width: 0; transition: box-shadow .2s; }
  #stage.rec { box-shadow: inset 0 0 0 3px var(--red), inset 0 0 60px #ff3b4e22; }
  .who { display: flex; gap: 12px; align-items: center; }
  .face { width: 96px; height: 104px; image-rendering: pixelated; background-repeat: no-repeat; border: 1px solid var(--line2); background-color: #000; flex: none; box-shadow: 0 0 0 3px #000, 0 0 16px #ff3b4e22; }
  .caller { color: var(--red); font: 10px var(--hud); letter-spacing: .1em; }
  .dir { color: var(--ink); font-size: 13px; max-width: 70ch; margin-top: 4px; }
  .dir b { color: var(--warn); font-weight: 600; }
  .line { font: 900 40px/1.05 var(--disp); letter-spacing: .03em; margin: 10px 0 4px; text-shadow: 0 2px 0 #000, 0 0 22px #ff3b4e33; overflow-wrap: anywhere; }
  .when { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .state { color: var(--dim); font-size: 12px; }
  .state.err { color: var(--red); }
  .warn { color: var(--warn); }
  .recdot { font: 10px var(--hud); color: var(--red); letter-spacing: .12em; animation: blink 1s steps(2) infinite; }
  .lcd { font: 12px var(--hud); color: #ffb0b8; background: #050203; border: 1px solid var(--line2); border-radius: 4px; padding: 3px 8px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 8px #ff3b4e22; }
  audio { height: 32px; max-width: 100%; }
  audio.ws-on { display: none; }
  h2 { font: 10px var(--hud); color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin: 24px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  h2::before { content: ''; width: 14px; height: 2px; background: var(--red); align-self: center; }
  .take { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 4px 0; font-size: 12px; font-family: ui-monospace, monospace; border-bottom: 1px dashed #2a151955; }
  .take > span { overflow-wrap: anywhere; }
  .keys { color: var(--dim); font-size: 12px; margin-top: 26px; line-height: 1.9; }
  /* ---------------- the live input monitor ---------------- */
  .monitor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 200px); gap: 8px; margin: 8px 0 4px; }
  .monitor .scr { position: relative; border: 1px solid var(--line2); border-radius: var(--r); background: #000; overflow: hidden; box-shadow: inset 0 0 18px #000; }
  .monitor canvas { display: block; width: 100%; height: 64px; }
  .monitor .lbl { position: absolute; right: 6px; top: 4px; font: 8px var(--hud); color: var(--mute); letter-spacing: .1em; pointer-events: none; }
  .monitor .lbl b { color: #ffb0b8; font-weight: 400; }
  @media (max-width: 520px) { .monitor { grid-template-columns: 1fr; } }
  /* ---------------- decks: a take's waveform, spectrogram and numbers ---------------- */
  .deck { border: 1px solid var(--line2); border-radius: 8px; background: linear-gradient(#130a0d, #0c0608); padding: 8px 10px 10px; margin: 10px 0; box-shadow: 0 4px 18px #0008, inset 0 1px 0 #ffffff08; }
  .deckh { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 6px; }
  .grow { flex: 1; }
  .lane-tag { font: 9px var(--hud); letter-spacing: .1em; color: #000; background: var(--red); border-radius: 3px; padding: 2px 6px; }
  .lane-tag.ok { background: var(--ok); }
  .reads { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .rd { font: 10px var(--hud); color: #ffd9dc; background: #050203; border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
  .rd i { font-style: normal; color: var(--mute); margin-right: 5px; }
  .rd.bad { color: var(--red); border-color: var(--red); }
  .rd.hot { color: var(--warn); border-color: #5a4a2a; }
  .rd.dim { color: var(--dim); }
  .wave { background: #050203; border: 1px solid var(--line); border-radius: 4px; min-height: 8px; overflow: hidden; }
  .wave:empty { display: none; }
  .lane { margin-top: 6px; border-radius: 6px; padding: 4px; border: 1px solid transparent; transition: opacity .15s, border-color .15s; }
  .lane .lt { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: none; border: 0; padding: 2px 0 4px; font: 10px var(--hud); color: var(--dim); letter-spacing: .08em; width: 100%; text-align: left; }
  .lane .lt:hover { background: none; color: var(--ink); }
  .lane .lt b { font-weight: 400; color: var(--ink); }
  .deck.ab[data-ab=A] #lane-a, .deck.ab[data-ab=B] #lane-b { border-color: var(--red); background: #ff3b4e0a; }
  .deck.ab[data-ab=A] #lane-b, .deck.ab[data-ab=B] #lane-a { opacity: .5; }
  .abs { display: inline-flex; }
  .abs button { border-radius: 0; font: 10px var(--hud); letter-spacing: .06em; padding: 6px 10px; }
  .abs button:first-child { border-radius: var(--r) 0 0 var(--r); }
  .abs button:last-child { border-radius: 0 var(--r) var(--r) 0; border-left: 0; }
  .abs button[aria-pressed=true] { background: var(--red); color: #000; border-color: var(--red); }
  .tp { min-width: 88px; }
  /* ---------------- the FX rack ---------------- */
  #fx { border-top: 1px solid var(--line); margin-top: 18px; }
  #fx h2 .state { text-transform: none; letter-spacing: 0; color: var(--warn); font: 12px system-ui, sans-serif; }
  .fxbar { margin: 6px 0; }
  input.plain { flex: 0 1 18ch; min-width: 10ch; background: #050203; text-transform: none; letter-spacing: 0; }
  input[type=search].plain { flex: 1 1 22ch; max-width: 40ch; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 8px; background: #050203; border: 1px solid var(--line); border-radius: var(--r); margin: 8px 0; }
  .chain .io { font: 9px var(--hud); color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; letter-spacing: .06em; }
  .chain .io.dim { color: var(--mute); border-style: dashed; }
  .chain .arr { width: 12px; height: 1px; background: var(--line2); position: relative; }
  .chain .arr::after { content: ''; position: absolute; right: 0; top: -3px; border: 3px solid transparent; border-left-color: var(--line2); border-right: 0; }
  .chain .link { font: 9px var(--hud); letter-spacing: .04em; padding: 3px 7px; border-color: var(--gc); color: var(--ink); background: linear-gradient(#1c1013, #120a0c); box-shadow: inset 2px 0 var(--gc); }
  .chain .link.muted { opacity: .35; }
  .chain .solonote { flex-basis: 100%; color: var(--warn); font-size: 11px; }
  .rackbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 6px; }
  .grp { margin: 8px 0; border-left: 2px solid var(--gc); padding-left: 8px; }
  .grph { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 4px 2px; font: 10px var(--hud); letter-spacing: .1em; text-transform: uppercase; color: var(--gc); }
  .grph:hover:not(:disabled) { background: #ffffff06; border-color: var(--line); }
  .grph .car { width: 0; height: 0; border: 4px solid transparent; border-top-color: var(--gc); border-bottom: 0; transition: transform .15s; }
  .grp.shut .grph .car { transform: rotate(-90deg); }
  .grph .gn { margin-left: auto; color: var(--mute); letter-spacing: .04em; }
  .grph .gn.lit { color: var(--ink); }
  .grp.shut .rack { display: none; }
  .rack { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; margin-top: 8px; }
  .fx { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px 8px; background: linear-gradient(#120a0c, #0d0708); min-width: 0; transition: border-color .15s, box-shadow .15s, opacity .15s; }
  .fx[hidden] { display: none; }
  .fx.on { border-color: var(--gc, var(--red)); box-shadow: inset 3px 0 var(--gc, var(--red)), 0 0 14px #ff3b4e14; background: linear-gradient(#1a0d11, #120a0c); }
  .fx:not(.on) .knob { opacity: .55; }
  .fx.solo { box-shadow: inset 3px 0 var(--warn), 0 0 0 1px var(--warn); }
  .fx.muted { opacity: .45; }
  .fx.flash { animation: flash .9s; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--red), 0 0 22px var(--red); } }
  .fxh { font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .pw { display: flex; gap: 8px; align-items: center; cursor: pointer; flex: 1; min-width: 0; }
  .pw .nm { overflow-wrap: anywhere; }
  /* the on / bypass switch */
  .pw input { appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 26px; height: 14px; border-radius: 7px; background: #2a1519; border: 1px solid var(--line2); position: relative; cursor: pointer; transition: background .15s; }
  .pw input::after { content: ''; position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--mute); transition: left .15s, background .15s; }
  .pw input:checked { background: #3a0a12; border-color: var(--gc, var(--red)); }
  .pw input:checked::after { left: 13px; background: var(--gc, var(--red)); box-shadow: 0 0 6px var(--gc, var(--red)); }
  .mini { font: 9px var(--hud); padding: 2px 6px; border-radius: 4px; }
  .mini[aria-pressed=true] { background: var(--warn); color: #000; border-color: var(--warn); }
  .blurb { color: var(--dim); font-size: 11px; margin: 3px 0 5px; }
  /* the label column fits the longest knob label; a longer one wraps, never clips */
  .knob { display: grid; grid-template-columns: 6.6em minmax(0, 1fr) 4.9em; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); min-height: 22px; }
  .knob span { overflow-wrap: anywhere; }
  .knob output { font: 9px var(--hud); color: var(--ink); text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  /* the faders */
  .knob input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
  .knob input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, #3a1a20, #2a1519); border: 1px solid #000; }
  .knob input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 16px; margin-top: -7px; border-radius: 2px; background: linear-gradient(#e9e0e0, #8a7a7e); border: 1px solid #000; box-shadow: 0 1px 2px #000; }
  .fx.on .knob input[type=range]::-webkit-slider-thumb { background: linear-gradient(#fff, var(--gc, var(--red))); }
  .knob input[type=range]:focus-visible { outline: none; }
  .knob input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--red), 0 0 8px var(--red); }
  .knob input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #2a1519; border: 1px solid #000; }
  .knob input[type=range]::-moz-range-thumb { width: 10px; height: 16px; border-radius: 2px; background: #c9bfc1; border: 1px solid #000; }
  .fxtag { color: var(--warn); font-size: 11px; border: 1px solid #5a4a2a; border-radius: 9px; padding: 0 6px; }
  /* SLAB's quips (LS2-quips): a section of their own under the fixed lines, an add box at its foot */
  .qhead { padding: 14px 14px 6px; color: var(--red); font: 10px var(--hud); letter-spacing: .12em; border-bottom: 1px solid var(--line); background: #120a0c; }
  .qhead span { color: var(--dim); font: 11px system-ui, sans-serif; letter-spacing: 0; margin-left: 6px; }
  .qhead .err { color: var(--red); font: 11px system-ui, sans-serif; letter-spacing: 0; margin-top: 4px; }
  .qadd { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  input[type=text] { flex: 1; min-width: 0; background: #000; color: var(--ink); border: 1px solid var(--line2); border-radius: var(--r); padding: 5px 8px; font: inherit; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  input[type=text].plain { text-transform: none; letter-spacing: 0; flex: 0 1 18ch; }
  .qedit input[type=text] { flex: 0 1 26ch; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a1519; border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<header>
  <h1>GRODIUS VOICE BOOTH<small>GET AWAY FROM THE MIC, YOU ...</small></h1>
  <label>Mic <select id="mic"><option>(allow the mic)</option></select></label>
  <div class="meterbox">
    <div class="meter" title="input level (peak bright, RMS dim, the white tick holds the peak): the loudest syllable inside the marked band, -10 to -6 dBFS, never past -3"><i id="rmsb"></i><i id="lvl"></i><b></b><s id="hold" class="off"></s></div>
    <div class="scale" aria-hidden="true"><span style="left:0%;transform:none">-60</span><span style="left:33.33%">-40</span><span style="left:66.67%">-20</span><span style="left:83.33%">-10</span><span style="left:95%">-3</span></div>
  </div>
  <span class="peak" id="pk" title="peak hold">-inf dB</span>
  <span class="led hot" id="hot" aria-hidden="true">HOT</span>
  <span class="led clip" id="clip" aria-hidden="true" title="CLIP: game over, man. Latches for the take; click to clear">CLIP</span>
  <span class="aim">aim -10 to -6, never past -3</span>
  <span class="hint" id="hint"></span>
</header>
<main>
  <nav id="slots" role="listbox" aria-label="voice lines"></nav>
  <section id="stage">
    <div id="view"></div>
    <div class="monitor" aria-hidden="true">
      <div class="scr"><canvas id="scope"></canvas><span class="lbl">INPUT &middot; TAKE PEAK <b id="take-pk">--</b></span></div>
      <div class="scr"><canvas id="rta"></canvas><span class="lbl">SPECTRUM</span></div>
    </div>
    <div id="review"></div>
    <div id="status" role="status" aria-live="polite" class="state"></div>
    <div id="fx"></div>
    <div id="takes"></div>
  </section>
</main>
<iframe id="textframe" src="/tools/booth/text.html" hidden title="game text"></iframe>
<script type="module" src="/tools/booth/booth.ts"></script>
</body>
</html>

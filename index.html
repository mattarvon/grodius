<title>Grodius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one 16:9 CRT viewport floating on void; everything else is drawn in-canvas */
:root{
  --void:#040507; --hull:#1b2027; --steel:#8fa3b8; --blood:#a10d14; --sodium:#e8f1ff; --dim:#4b5663;
  --f-display:"Grenze Gotisch", "UnifrakturCook", Georgia, serif;
  --f-hud:"Silkscreen", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--steel);overflow:hidden;display:grid;place-items:center;padding-inline:16px;box-sizing:border-box;font-family:var(--f-hud);touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;box-shadow:0 0 0 1px #11161c,0 0 60px rgba(161,13,20,.18)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
#crt{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
@media (prefers-reduced-motion:no-preference){#vig{animation:fl 6s steps(60) infinite}}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.92}}
.tb{position:absolute;font-family:var(--f-hud);font-size:12px;letter-spacing:.08em;color:var(--sodium);background:rgba(120,8,14,.55);border:1px solid rgba(255,90,90,.55);border-radius:50%;touch-action:none}
#pw{right:3%;bottom:14%;width:74px;height:74px}
#ps{right:3%;top:4%;width:40px;height:40px;font-size:11px;background:rgba(20,26,32,.6);border-color:var(--dim)}
.tb:focus-visible{outline:2px solid var(--sodium)}
</style>

<div id="wrap">
  <canvas id="c" width="480" height="270" tabindex="0" aria-label="Grodius, a horizontal space shooter"></canvas>
  <div id="crt"></div>
  <div id="vig"></div>
  <button id="pw" class="tb" hidden>POWER</button>
  <button id="ps" class="tb" hidden>II</button>
</div>

<script>
'use strict';
// =====================================================================
//  GRODIUS  -  side-scrolling shooter. Derelict MERIDIAN, Neptune orbit.
// =====================================================================
const W=480,H=270,PH=254,TS=4,LEVEL=9400,BOSS_AT=8700;
const cv=document.getElementById('c'),dctx=cv.getContext('2d'),lo=document.createElement('canvas');lo.width=W;lo.height=H;const ctx=lo.getContext('2d');let DK=2;
const wrap=document.getElementById('wrap'),crt=document.getElementById('crt');
const pwBtn=document.getElementById('pw'),psBtn=document.getElementById('ps');
ctx.imageSmoothingEnabled=false;
const lc=document.createElement('canvas');lc.width=W;lc.height=H;const lctx=lc.getContext('2d');
const hc=document.createElement('canvas');hc.width=W;hc.height=H;const hx=hc.getContext('2d');

const R=Math.random,TAU=Math.PI*2;
const rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const vnoise=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)};
const pick=a=>a[Math.floor(R()*a.length)];
const dist2=(a,b,c,d)=>(a-c)*(a-c)+(b-d)*(b-d);
function swapRm(a,i){a[i]=a[a.length-1];a.pop()}

const C={blood:'#a10d14',bloodD:'#4e0307',bloodL:'#e0242c',flesh:'#b5604f',fleshD:'#6e2b26',fleshL:'#de8d76',fat:'#e3c48f',bone:'#e8e0cc',steel:'#8fa3b8',suit:'#3a4757',skin:'#c9bcae'};
const DC=['#a10d14','#5a050a','#e3202a','#0c0809','#b8a35a','#ff7a1a'];
const FIRE=['#ffb347','#ff6a1a','#ffe2a0','#ff3a10','#fff1c0'];
const FONT_H='Silkscreen, "Courier New", monospace',FONT_D='"Grenze Gotisch", Georgia, serif';

// ---------------- persistence ----------------
const SET={flashes:true,muted:false};
let hi=0,meta={bio:0,lv:{}};
try{const d=JSON.parse(localStorage.getItem('grodius.v1')||'null');if(d){meta={bio:+(d.meta&&d.meta.bio)||0,lv:{...((d.meta&&d.meta.lv)||{})}};hi=+d.hi||0;SET.flashes=d.flashes!==false;SET.muted=!!d.muted}}catch(e){}
function save(){try{localStorage.setItem('grodius.v1',JSON.stringify({meta,hi,flashes:SET.flashes,muted:SET.muted}))}catch(e){}}
const lv=id=>meta.lv[id]||0;
const UPG=[
 {id:'hull',name:'REINFORCED HULL',desc:'One more ship per run.',max:3,cost:[150,380,800]},
 {id:'nerve',name:'NERVE GRAFT',desc:'Start every life with THRUST already stacked.',max:2,cost:[90,260]},
 {id:'hollow',name:'HOLLOW-POINT RIVETS',desc:'+25% damage on every gun, wraiths included.',max:4,cost:[100,240,480,900]},
 {id:'gland',name:'HARVEST GLAND',desc:'+25% biomass squeezed out of every kill.',max:4,cost:[80,200,400,750]},
 {id:'lure',name:'AMPOULE LURE',desc:'Power ampoules drift toward you.',max:2,cost:[120,300]},
 {id:'skin',name:'SECOND SKIN',desc:'Every life starts with a WARD field.',max:1,cost:[420]},
 {id:'wraith',name:'BOUND WRAITH',desc:'Every life starts with a WRAITH in tow.',max:2,cost:[380,950]},
 {id:'salvage',name:'BLACK BOX',desc:'Keep MISSILE, SPLIT, ARC and PYRE when you die.',max:1,cost:[800]},
];

// ---------------- audio ----------------
const AU={c:null,last:{}};
function auInit(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const A=new AC();AU.c=A;
  const comp=A.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.connect(A.destination);
  AU.m=A.createGain();AU.m.gain.value=SET.muted?0:.55;AU.m.connect(comp);
  const len=A.sampleRate*2,b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=R()*2-1;AU.noise=b;
  const il=A.sampleRate*2.6|0,ib=A.createBuffer(2,il,A.sampleRate);
  for(let c=0;c<2;c++){const ch=ib.getChannelData(c);for(let i=0;i<il;i++)ch[i]=(R()*2-1)*Math.pow(1-i/il,3.2)}
  AU.verb=A.createConvolver();AU.verb.buffer=ib;const vg=A.createGain();vg.gain.value=.4;AU.verb.connect(vg);vg.connect(AU.m);
  // drone bed
  const g=A.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.12,A.currentTime+4);
  const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=160;lp.Q.value=5;
  [41.2,41.75,82.1,61.9].forEach((f,i)=>{const o=A.createOscillator();o.type=i===3?'triangle':'sawtooth';o.frequency.value=f;const og=A.createGain();og.gain.value=i===3?.4:1;o.connect(og);og.connect(lp);o.start()});
  const lfo=A.createOscillator();lfo.frequency.value=.06;const lg=A.createGain();lg.gain.value=70;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  const ns=A.createBufferSource();ns.buffer=AU.noise;ns.loop=true;const nf=A.createBiquadFilter();nf.type='lowpass';nf.frequency.value=80;const ng=A.createGain();ng.gain.value=.35;ns.connect(nf);nf.connect(ng);ng.connect(g);ns.start();
  lp.connect(g);g.connect(AU.m);AU.lp=lp;
}
function thr(k,ms){const n=performance.now();if(AU.last[k]&&n-AU.last[k]<ms)return true;AU.last[k]=n;return false}
function route(node,wet){node.connect(AU.m);if(wet){const g=AU.c.createGain();g.gain.value=wet;node.connect(g);g.connect(AU.verb)}}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(o){
  if(!AU.c||SET.muted)return;const A=AU.c,t=A.currentTime+(o.at||0),dur=o.dur||.1,a=o.a||.003;
  const os=A.createOscillator();os.type=o.type||'square';os.frequency.setValueAtTime(o.f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const g=A.createGain();env(g,t,a,dur,o.vol||.1);let n=os;
  if(o.lp||o.bp){const f=A.createBiquadFilter();f.type=o.bp?'bandpass':'lowpass';f.frequency.value=o.bp||o.lp;f.Q.value=o.q||1;os.connect(f);n=f}
  n.connect(g);route(g,o.wet??.1);os.start(t);os.stop(t+a+dur+.05);
}
function nz(o){
  if(!AU.c||SET.muted)return;const A=AU.c,t=A.currentTime+(o.at||0),dur=o.dur||.1,a=o.a||.003;
  const s=A.createBufferSource();s.buffer=AU.noise;const f=A.createBiquadFilter();f.type=o.ft||'lowpass';
  f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
  const g=A.createGain();env(g,t,a,dur,o.vol||.2);s.connect(f);f.connect(g);route(g,o.wet??.2);s.loop=true;s.start(t,R()*1.5);s.stop(t+a+dur+.05);
}
const sfx={
  shot(){if(thr('s',55))return;tone({f:1250,f2:420,dur:.05,vol:.03,wet:.04})},
  laser(){if(thr('l',75))return;tone({type:'sawtooth',f:2300,f2:240,dur:.15,vol:.04,lp:5200})},
  missile(){if(thr('m',120))return;nz({f:1500,f2:300,dur:.2,vol:.06,ft:'bandpass',q:2})},
  hit(){if(thr('h',38))return;nz({f:1700,f2:260,dur:.06,vol:.12});tone({type:'sine',f:170,f2:55,dur:.07,vol:.12})},
  tink(){if(thr('t',60))return;tone({type:'triangle',f:2700,f2:1900,dur:.05,vol:.045});nz({f:5000,dur:.03,vol:.04,ft:'highpass'})},
  gore(sz){if(thr('g',45))return;const v=Math.min(1,.3+sz*.14);nz({f:2600,f2:80,dur:.25+sz*.12,vol:.38*v,wet:.25});tone({type:'sine',f:130,f2:26,dur:.25+sz*.1,vol:.5*v});for(let k=0;k<2+sz*2;k++)nz({at:R()*.22*sz+.02,f:rr(500,1500),f2:rr(140,300),dur:.05,vol:.18*v,ft:'bandpass',q:3})},
  pick(){[523,784,1046].forEach((f,i)=>tone({at:i*.05,f,dur:.07,vol:.05}))},
  power(){[262,330,392,523].forEach((f,i)=>tone({at:i*.04,type:'sawtooth',f,dur:.2,vol:.04,lp:2600}))},
  deny(){tone({f:140,f2:90,dur:.15,vol:.06})},
  die(){nz({f:4200,f2:50,dur:1.5,vol:.6,wet:.5});tone({type:'sawtooth',f:820,f2:85,dur:1.3,vol:.12,bp:900,q:3});tone({type:'sine',f:95,f2:20,dur:1.2,vol:.6})},
  eshot(){if(thr('e',80))return;tone({f:330,f2:190,dur:.07,vol:.025})},
  glob(){if(thr('gb',100))return;nz({f:650,f2:180,dur:.16,vol:.12,ft:'bandpass',q:4})},
  whisper(){nz({f:700,f2:1900,dur:1.1,vol:.2,ft:'bandpass',q:9,wet:.9});nz({at:.3,f:1700,f2:480,dur:.9,vol:.14,ft:'bandpass',q:12,wet:.9})},
  roar(){tone({type:'sawtooth',f:72,f2:36,dur:2.3,vol:.26,lp:520,a:.2,wet:.5});tone({type:'sawtooth',f:75,f2:39,dur:2.3,vol:.2,lp:420,a:.2});nz({f:520,f2:110,dur:2.1,vol:.26,a:.3,wet:.5})},
  alarm(){for(let i=0;i<6;i++)tone({at:i*.36,f:i%2?660:880,dur:.3,vol:.045,lp:3000,wet:.3})},
  heart(){tone({type:'sine',f:62,f2:40,dur:.13,vol:.45});tone({at:.19,type:'sine',f:56,f2:38,dur:.13,vol:.34})},
  squish(){if(thr('q',70))return;nz({f:900,f2:240,dur:.07,vol:.07,ft:'bandpass',q:5})},
  purge(){nz({f:6000,f2:60,dur:1.7,vol:.6,wet:.6});tone({type:'sine',f:210,f2:20,dur:1.5,vol:.6})},
  beam(){tone({type:'sawtooth',f:110,f2:58,dur:.85,vol:.15,lp:1300});nz({f:3200,f2:700,dur:.85,vol:.15})},
  tele(){if(thr('tl',300))return;tone({type:'sine',f:1900,f2:2600,dur:.25,vol:.03})},
  shield(){tone({type:'triangle',f:950,f2:300,dur:.15,vol:.08})},
  menu(){tone({f:660,dur:.03,vol:.035})},
  groan(){nz({f:250,f2:65,dur:2.6,vol:.2,ft:'bandpass',q:18,a:.6,wet:.9})},
  pyre(){if(thr('py',50))return;nz({f:1900,f2:80,dur:.5,vol:.42,wet:.3});tone({type:'sine',f:170,f2:28,dur:.4,vol:.42});nz({at:.04,f:3200,f2:600,dur:.3,vol:.16,ft:'highpass'});nz({at:.08,f:500,f2:1400,dur:.35,vol:.12,ft:'bandpass',q:3})},
  fireball(){if(thr('fb',110))return;nz({f:600,f2:2400,dur:.2,vol:.08,ft:'bandpass',q:2})},
  lash(){nz({f:6000,f2:900,dur:.09,vol:.34,ft:'highpass',q:2});tone({at:.02,f:2600,f2:420,dur:.07,vol:.09})},
  chain(){if(thr('ch',150))return;for(let k=0;k<5;k++)tone({at:k*.035,type:'triangle',f:rr(1800,3600),f2:rr(900,1500),dur:.04,vol:.035})},
  bomb(){if(thr('bm',80))return;nz({f:1300,f2:60,dur:.38,vol:.34,wet:.25});tone({type:'sine',f:115,f2:28,dur:.32,vol:.38})},
  hype(){[82.4,123.5,164.8].forEach(f=>tone({type:'sawtooth',f,dur:.7,vol:.07,lp:1900,a:.01,wet:.3}));[82.4,123.5,164.8].forEach(f=>tone({at:.18,type:'sawtooth',f:f*1.335,dur:.9,vol:.06,lp:1900,wet:.3}));
    nz({f:900,dur:1.4,vol:.16,ft:'bandpass',q:.7,a:.15,wet:.6});tone({type:'sine',f:60,f2:40,dur:.4,vol:.4})},
  drip(){if(thr('dr',200))return;tone({type:'sine',f:rr(1100,1500),f2:500,dur:.05,vol:.02,wet:.6})},
};
function say(t){if(SET.muted)return;try{const S=window.speechSynthesis;if(!S)return;const u=new SpeechSynthesisUtterance(t);u.pitch=.3;u.rate=.92;u.volume=1;S.cancel();S.speak(u)}catch(e){}}
function setMute(m){SET.muted=m;if(AU.m)AU.m.gain.value=m?0:.55}

// ---------------- input ----------------
const K={},PR=new Set();
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!K[e.code])PR.add(e.code);K[e.code]=true;auInit();
});
addEventListener('keyup',e=>{K[e.code]=false});
addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')openPause();if(AU.c)AU.c.suspend()}else if(AU.c)AU.c.resume()});
addEventListener('blur',()=>{for(const k in K)K[k]=false;if(state==='play')openPause()});
const I={x:0,y:0,fire:false,power:false,up:false,down:false,ok:false,back:false,pause:false};
let padPrev=[];
const touch={id:null,lx:0,ly:0,dx:0,dy:0,power:false,used:false};
function pollInput(){
  let x=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0),y=(K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0);
  let fire=!!(K.KeyZ||K.Space||K.KeyJ)||touch.used;
  let power=PR.has('KeyX')||PR.has('ShiftLeft')||PR.has('ShiftRight')||PR.has('KeyK')||touch.power;
  let up=PR.has('ArrowUp')||PR.has('KeyW'),down=PR.has('ArrowDown')||PR.has('KeyS');
  let ok=PR.has('Enter')||PR.has('Space')||PR.has('KeyZ'),back=PR.has('Escape')||PR.has('KeyX')||PR.has('Backspace');
  let pause=PR.has('KeyP')||PR.has('Escape');
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const p of pads){if(!p)continue;
    const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),was=i=>!!padPrev[i],tap=i=>b(i)&&!was(i);
    const ax=p.axes[0]||0,ay=p.axes[1]||0;
    if(Math.abs(ax)>.35)x=Math.sign(ax);if(Math.abs(ay)>.35)y=Math.sign(ay);
    if(b(14))x=-1;if(b(15))x=1;if(b(12))y=-1;if(b(13))y=1;
    fire=fire||b(0)||b(7)||b(5);power=power||tap(1)||tap(2)||tap(4);ok=ok||tap(0);back=back||tap(1);pause=pause||tap(9);
    up=up||tap(12)||(ay<-.5&&!padPrev.ay);down=down||tap(13)||(ay>.5&&!padPrev.ay);
    padPrev=p.buttons.map(q=>q.pressed);padPrev.ay=Math.abs(ay)>.5;break;
  }
  touch.power=false;if(state!=='play'){touch.dx=touch.dy=0}
  Object.assign(I,{x,y,fire,power,up,down,ok,back,pause});
}
let SCALE=1;
cv.addEventListener('touchstart',e=>{auInit();touch.used=true;pwBtn.hidden=false;psBtn.hidden=false;
  for(const t of e.changedTouches)if(touch.id===null){touch.id=t.identifier;touch.lx=t.clientX;touch.ly=t.clientY}
  if(state==='play')e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===touch.id){
  touch.dx+=(t.clientX-touch.lx)/SCALE*1.35;touch.dy+=(t.clientY-touch.ly)/SCALE*1.35;touch.lx=t.clientX;touch.ly=t.clientY}
  e.preventDefault()},{passive:false});
const tend=e=>{for(const t of e.changedTouches)if(t.identifier===touch.id)touch.id=null};
cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
pwBtn.addEventListener('touchstart',e=>{e.preventDefault();touch.power=true});
pwBtn.addEventListener('click',()=>{touch.power=true});
psBtn.addEventListener('click',()=>{if(state==='play')openPause();else if(state==='pause')state='play'});
cv.addEventListener('pointerdown',e=>{auInit();cv.focus();if(state==='play')return;const r=cv.getBoundingClientRect();
  const gx=(e.clientX-r.left)/r.width*W,gy=(e.clientY-r.top)/r.height*H;menuPointer(gx,gy)});
function fit(){
  const aw=innerWidth-32,ah=innerHeight-32;let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s*4)/4;s=Math.max(.5,s);SCALE=s;
  wrap.style.width=W*s+'px';wrap.style.height=H*s+'px';
  const k=Math.max(2,Math.min(5,Math.ceil(s*(window.devicePixelRatio||1))));if(cv.width!==W*k){DK=k;cv.width=W*k;cv.height=H*k}
  crt.style.background=`repeating-linear-gradient(to bottom,transparent 0,transparent ${s*.55}px,rgba(0,0,0,.32) ${s*.55}px,rgba(0,0,0,.32) ${s}px)`;
}
addEventListener('resize',fit);fit();

// ---------------- world state ----------------
let state='title',T=0,G=null,P=null,menuSel=0,menuBoxes=[];
const shots=[],eshots=[],enemies=[],drops=[],gibs=[],mists=[],sparks=[],flashes=[],decals=[],geysers=[],splats=[],caps=[],orbs=[],texts=[];
const ALL=[shots,eshots,enemies,drops,gibs,mists,sparks,flashes,decals,geysers,splats,caps,orbs,texts];
let LIGHTS=[];
let CEIL=new Float32Array(10).fill(-99),FLOOR=new Float32Array(10).fill(H+99);
const floorAt=wx=>{const f=wx/TS,i=Math.floor(f);if(i<0)return FLOOR[0];if(i>=FLOOR.length-1)return FLOOR[FLOOR.length-1];return lerp(FLOOR[i],FLOOR[i+1],f-i)};
const ceilAt=wx=>{const f=wx/TS,i=Math.floor(f);if(i<0)return CEIL[0];if(i>=CEIL.length-1)return CEIL[CEIL.length-1];return lerp(CEIL[i],CEIL[i+1],f-i)};
const AMT={
  hull:s=>sstep(2200,2700,s),
  corr:s=>sstep(5000,5500,s)*(1-sstep(8300,8700,s)),
  core:s=>sstep(8300,8750,s),
  space:s=>1-sstep(4800,5400,s),
};
const grav=()=>{if(!G)return .08;const s=G.scroll;return lerp(lerp(.035,.12,AMT.corr(s)),.075,AMT.core(s))};

function buildTerrain(L){
  const n=Math.ceil((LEVEL+W*2)/TS)+2;CEIL=new Float32Array(n);FLOOR=new Float32Array(n);const o=L*91.7;
  for(let i=0;i<n;i++){const x=i*TS;
    const fT=sstep(2250,2700,x)*(1-sstep(8250,8600,x)),cT=sstep(3500,3950,x)*(1-sstep(8250,8600,x));
    const kT=sstep(5050,5500,x)*(1-sstep(8150,8500,x)),zT=sstep(8300,8700,x);
    const a=vnoise(x/210+o)*2-1,b=vnoise(x/61+o+5)*2-1,c=vnoise(x/19+o+9)*2-1;
    const a2=vnoise(x/190+o+40)*2-1,b2=vnoise(x/57+o+45)*2-1,c2=vnoise(x/23+o+49)*2-1;
    let fl=PH-30-a*24-b*8-c*2-kT*(24+a*12);
    let ce=24+a2*20+b2*8+c2*2+kT*(28+a2*10);
    const blk=Math.floor(x/360),bx=x%360;
    if(blk%2===1&&bx<44&&x>2800&&x<5000){if(hash(blk+L)<.5)fl-=34;else ce+=34}
    fl=lerp(PH+70,fl,fT);ce=lerp(-70,ce,cT);fl=lerp(fl,PH-12,zT);ce=lerp(ce,12,zT);
    if(fl-ce<104){const m=(fl+ce)/2;fl=m+52;ce=m-52}
    FLOOR[i]=fl;CEIL[i]=ce;
  }
}

function splat(x,y,sz){
  if(splats.length>24)splats.shift();
  const b=[],dr=[];for(let i=0;i<5+sz*3;i++)b.push({dx:rr(-1,1)*sz*11,dy:rr(-1,1)*sz*7,r:rr(2,5.5)*Math.sqrt(sz)});

  for(let i=0;i<sz*8;i++)b.push({dx:rr(-1,1)*sz*20,dy:rr(-1,1)*sz*14,r:rr(.5,1.4)});

function gore(x,y,sz,o={}){
  const dir=o.dir||0,nd=Math.min(950,70+sz*125);
  for(let k=0;k<nd;k++){const a=R()*TAU,sp=rr(.3,4.3)*Math.sqrt(sz)*(R()<.2?1.8:1);
    const c=o.fire&&R()<.4?5:o.black&&R()<.55?3:o.amnio&&R()<.35?4:R()<.22?2:R()<.3?1:0;
    drop(x+rr(-3,3)*sz,y+rr(-3,3)*sz,Math.cos(a)*sp+dir*rr(0,2.4),Math.sin(a)*sp-.6,rr(1,1.7+sz*.5),c,ri(80,200))}
  for(let k=0;k<4+sz*4;k++)mist(x+rr(-5,5)*sz,y+rr(-5,5)*sz,rr(3,7)*(.6+sz*.4),ri(30,70));
  const gv=()=>[rr(-2.6,2.6)*Math.sqrt(sz)+dir*rr(.5,2.2),rr(-2.9,1.6)*Math.sqrt(sz)];
  for(let k=0;k<5+sz*6;k++){const[vx,vy]=gv();gib(x+rr(-4,4),y+rr(-4,4),vx,vy,'chunk',rr(1.8,3.4)+sz*.5)}
  for(let k=0;k<Math.floor(sz*4);k++){const[vx,vy]=gv();gib(x,y,vx,vy,'bone',rr(2.5,5.5))}
  for(let k=0;k<(o.teeth||0)*2;k++){const[vx,vy]=gv();gib(x,y,vx*1.3,vy*1.3,'tooth',1.3)}
  const ne=(o.eyes||0)*2+(sz>=1?ri(0,2):0);
  for(let k=0;k<ne;k++){const[vx,vy]=gv();const g=gib(x,y,vx,vy,'eye',rr(2.2,3));if(g&&o.fire)g.burning=ri(60,140)}
  const sk=o.skull!=null?o.skull+(sz>=2?1:0):sz>=1.4?ri(1,1+Math.floor(sz/2)):(R()<.3?1:0);
  for(let k=0;k<sk;k++){const[vx,vy]=gv();gib(x,y,vx*.9,vy*.9-.6,'skull',rr(3,4.2))}
  const lb=o.limbs!=null?o.limbs+(sz>=2?1:0):sz>=1.4?ri(1,2+Math.floor(sz/2)):(R()<.25?1:0);
  for(let k=0;k<lb;k++){const[vx,vy]=gv();gib(x,y,vx*1.15,vy*1.15,'limb',rr(3,5))}
  const ropes=o.rope!=null?o.rope:sz>=1.4?ri(1,Math.ceil(sz)+1):(R()<.5?1:0);
  for(let k=0;k<ropes;k++){const[vx,vy]=gv();gib(x,y,vx*1.2,vy*1.2,'rope',3)}
  if(o.chain)for(let k=0;k<o.chain;k++){const[vx,vy]=gv();gib(x,y,vx,vy,'rope',3,{chain:1})}
  if(o.metal)for(let k=0;k<o.metal;k++){const[vx,vy]=gv();gib(x,y,vx*1.4,vy*1.4,'metal',rr(1.5,4))}
  if(o.half){const e=o.half;for(const side of [-1,1]){const g=gib(e.x,e.y+side*3,dir*rr(.6,1.8)+rr(-.5,.5),side*rr(.8,1.8),'half',e.r);if(g){g.e=e;g.side=side;g.vr=side*rr(.04,.12);g.rot=e.rot||0}}}
  flash(x,y,20+sz*16,9,o.fire?'255,140,40':'255,60,40');
  if(G){G.shake=Math.min(16,G.shake+sz*1.8);if(sz>=3)G.hitstop=Math.max(G.hitstop,5)}
  if(sz>=3||(sz>=1.5&&R()<.45))splat(x*.4+W*.3+rr(-70,70),y*.5+PH*.25+rr(-40,40),Math.min(4,sz*.8));
  sfx.gore(sz);
}

function whipPts(e){
  const hx=e.x-7,hy=e.y+1,pts=[];let len,ang,amp;
  if(e.ws==='strike'){const p=e.wt/26,ext=p<.3?sstep(0,.3,p):1-sstep(.55,1,p);len=14+108*ext;ang=e.ang;amp=(1-ext)*9+2}
  else if(e.ws==='tel'){len=22;ang=e.ang+Math.PI+Math.sin(e.wt*.6)*.3;amp=5}
  else{len=30;ang=Math.PI/2+.35*Math.sin(e.t*.05);amp=4}
  for(let i=0;i<=14;i++){const f=i/14,w=Math.sin(f*6-e.t*.4)*amp*f;
    pts.push({x:hx+Math.cos(ang)*len*f-Math.sin(ang)*w,y:hy+Math.sin(ang)*len*f+Math.cos(ang)*w+(e.ws==='idle'?f*f*6:0)})}
  return pts;
}

function tentPts(b,t){

}

function bossHitByShot(s){

    b.hp-=s.dmg;b.fl=3;for(let k=0;k<3;k++)drop(s.x,s.y,rr(-2.5,-.3),rr(-1.4,1.4),1.5,R()<.6?3:0,90);sfx.hit();
    if(b.hp<=0){b.dying=220;G.hitstop=24;G.score+=30000*(G.loop+1);pop(b.x,b.y-40,'+'+30000*(G.loop+1),'#ffffff',16,120);sfx.roar();
      for(const e of enemies)if(!e.dead)killEnemy(e,-1)}
    return true}
  return false;
}

// ---------------- player ----------------
const SLOTS=['THRUST','MISSILE','SPLIT','ARC','PYRE','WRAITH','WARD'];
function slotMaxed(i){return[P.speed>=5,P.missile>=2,P.double>0,P.laser>0,P.pyre>=2,P.options>=4,P.shield>0][i]}
function applyPower(){
  const i=G.meter;if(i<0||!P.alive)return;if(slotMaxed(i)){sfx.deny();return}
  if(i===0)P.speed++;else if(i===1)P.missile++;else if(i===2){P.double=1;P.laser=0}else if(i===3){P.laser=1;P.double=0}else if(i===4)P.pyre++;else if(i===5)P.options++;else P.shield=10;
  G.meter=-1;sfx.power();pop(P.x,P.y-14,SLOTS[i]+(i===4&&P.pyre>1?' II':''),'#ff6a6a',8,50);flash(P.x,P.y,40,10,i===4?'255,140,40':'255,80,80');
}
function optPos(i){const h=P.hist,k=(i+1)*13;if(!h.length)return{x:P.x-14*(i+1),y:P.y};return h[Math.min(k,h.length-1)]}
function playerHit(){
  if(!P.alive||P.inv>0)return false;
  if(P.shield>0){P.shield--;P.inv=18;sfx.shield();for(let i=0;i<10;i++)spark(P.x,P.y,rr(-3,3),rr(-3,3),12,'#9fd2ff');return false}
  killPlayer();return true;
}
function fire(){
  const dm=1+.25*lv('hollow'),org=[{x:P.x,y:P.y}];for(let i=0;i<P.options;i++)org.push(optPos(i));
  if(P.laser){P.cd=9;for(const o of org)shots.push({k:'laser',x:o.x+8,y:o.y,vx:8.5,vy:0,len:4,dmg:1.7*dm,hit:new Set(),r:2});sfx.laser()}
  else{P.cd=7;for(const o of org){shots.push({k:'bolt',x:o.x+10,y:o.y,vx:7.5,vy:0,dmg:dm,r:2});
    if(P.double)shots.push({k:'bolt',x:o.x+6,y:o.y-2,vx:5.3,vy:-5.3,dmg:dm,r:2,diag:1})}sfx.shot()}

  if(P.missile&&P.mcd<=0){P.mcd=34;for(const o of org){shots.push({k:'missile',x:o.x,y:o.y+3,vx:1.5,vy:2.2,dmg:3*dm,r:3,dir:1,g:0});
    if(P.missile>1)shots.push({k:'missile',x:o.x,y:o.y-3,vx:1.5,vy:-2.2,dmg:3*dm,r:3,dir:-1,g:0})}sfx.missile()}
  if(P.pyre&&P.pcd<=0){P.pcd=P.pyre>1?20:30;const src=P.pyre>1?org:[org[0]];
    for(const o of src)shots.push({k:'pyre',x:o.x+8,y:o.y,vx:4.4,vy:-1.1,dmg:5*dm,r:4,rot:R()*TAU});sfx.fireball()}
}
function updatePlayer(){
  if(!P.alive){G.deadT--;if(G.deadT<=0)respawn();return}

  let mx=dx*sp,my=dy*sp;

function hitShot(s,cx,cy,r){
  if(s.k==='laser'){const nx=clamp(cx,s.x,s.x+s.len),ny=clamp(cy,s.y-1.5,s.y+1.5);return dist2(nx,ny,cx,cy)<r*r}
  return dist2(s.x,s.y,cx,cy)<(r+s.r)*(r+s.r);
}
function boom(x,y,d=0){
  if(d)for(const e of enemies){if(e.dead)continue;const ey=e.k==='eye'?e.y-e.o*9:e.k==='cross'?e.y+e.o*12:e.y;if(dist2(x,y,e.x,ey)<(24+e.r)**2)hurt(e,d,e.x,ey,1)}
  flash(x,y,30,9,'255,150,60');for(let i=0;i<18;i++)spark(x,y,rr(-2.5,2.5),rr(-2.5,1),ri(8,20),pick(FIRE));
  for(let i=0;i<10;i++)drop(x,y,rr(-2,2),rr(-2.5,.5),1,5,40);if(G)G.shake+=1.2;sfx.bomb()}
function pyreBoom(x,y,d){
  if(d)for(const e of enemies){if(e.dead)continue;const r=30+e.r,dd=dist2(x,y,e.x,e.y);
    if(dd<r*r){hurt(e,d*(dd<(12+e.r)**2?1:.6),e.x,e.y,1);if(!e.dead)e.burn=Math.max(e.burn||0,130)}}
  flash(x,y,50,14,'255,140,40');flash(x,y,22,8,'255,240,200');light(x,y,90,1);
  for(let i=0;i<34;i++){const a=R()*TAU,sp=rr(.5,3.5);spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp-.5,ri(10,26),pick(FIRE))}
  for(let i=0;i<46;i++){const a=R()*TAU,sp=rr(.4,3);drop(x,y,Math.cos(a)*sp,Math.sin(a)*sp-.8,rr(1,1.8),R()<.55?5:R()<.5?2:0,ri(50,110))}
  for(let i=0;i<3;i++){const g=gib(x,y,rr(-2.4,2.4),rr(-2.8,.6),'eye',rr(1.8,2.6));if(g){g.burning=ri(70,150);g.iris='#ff3a10'}}
  for(let i=0;i<4;i++)mist(x+rr(-6,6),y+rr(-6,6),rr(4,8),ri(25,45));
  if(G)G.shake=Math.min(16,G.shake+2.5);sfx.pyre()}
function updateShots(){
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];let dead=false;
    if(s.k==='laser'){s.len=Math.min(50,s.len+8);s.x+=s.vx}
    else if(s.k==='missile'){
      if(!s.g){s.x+=s.vx;s.y+=s.vy;const wx=s.x+G.scroll,surf=s.dir>0?floorAt(wx):ceilAt(wx);
        if(s.dir>0?s.y+3>=surf:s.y-3<=surf){if(s.dir>0?surf<PH+5:surf>-5){s.g=1}}}
      else{const nx=s.x+3.2,ns=s.dir>0?floorAt(nx+G.scroll):ceilAt(nx+G.scroll);
        if(Math.abs(ns-(s.y+s.dir*3))>7){boom(s.x,s.y);dead=true}else{s.x=nx;s.y=ns-s.dir*3}}
      if(G.t%2===0)spark(s.x-3,s.y,-.5,rr(-.2,.2),10,'#6b7480');
    }else if(s.k==='pyre'){s.vy+=.035;s.x+=s.vx;s.y+=s.vy;s.rot+=.25;
      for(let k=0;k<2;k++)spark(s.x-3,s.y+rr(-1.5,1.5),rr(-1.6,-.4),rr(-.6,.2),ri(6,14),pick(FIRE));
      if(R()<.35)drop(s.x-3,s.y,rr(-1,-.2),rr(-.3,.3),1,5,30)}
    else{s.x+=s.vx;s.y+=s.vy}
    if(!dead&&!(s.k==='missile'&&s.g)){const tx=s.k==='laser'?s.x+s.len:s.x,wx=tx+G.scroll;
      if(s.y>=floorAt(wx)||s.y<=ceilAt(wx)){for(let k=0;k<4;k++)spark(tx,s.y,rr(-2,0),rr(-1.5,1.5),ri(5,10),'#cfe6ff');if(s.k==='missile')boom(s.x,s.y,s.dmg*.8);if(s.k==='pyre')pyreBoom(s.x,s.y,s.dmg);dead=true}}
    if(!dead){
      for(const e of enemies){if(e.dead)continue;const ey=e.k==='eye'?e.y-e.o*9:e.y;let hit=hitShot(s,e.x,ey,e.r);if(!hit&&e.k==='cross')hit=hitShot(s,e.x,e.y+e.o*14,9);if(!hit)continue;
        if(s.k==='pyre'){pyreBoom(s.x,s.y,s.dmg);dead=true;break}
        if(s.k==='laser'){if(s.hit.has(e))continue;s.hit.add(e);hurt(e,s.dmg,e.x-e.r*.5,s.y,1);continue}
        hurt(e,s.dmg,s.x,s.y,1);if(s.k==='missile')boom(s.x,s.y,s.dmg*.8);dead=true;break}
      if(!dead&&G.boss&&bossHitByShot(s)&&s.k!=='laser'){if(s.k==='pyre')pyreBoom(s.x,s.y,0);else if(s.k==='missile')boom(s.x,s.y,0);dead=true}
    }
    if(dead||s.x>W+12||s.y<-12||s.y>PH+12)swapRm(shots,i);
  }
}
function updateEShots(){

function updateEnemies(){

// ---------------- fx simulation ----------------
function updateFX(){
  const g=grav(),ss=G?G.scrollSpeed:0,sc=G?G.scroll:0;
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.px=d.x;d.py=d.y;d.vy+=g;d.vx*=.988;d.vy*=.988;d.x+=d.vx-ss*.6;d.y+=d.vy;d.l--;
    const wx=d.x+sc,f=floorAt(wx),c=ceilAt(wx);
    if(d.y>=f){addDecal(wx,f,d.s,1);swapRm(drops,i);continue}
    if(d.y<=c){addDecal(wx,c,d.s,-1);swapRm(drops,i);continue}
    if(d.l<=0||d.x<-10||d.x>W+10||d.y>H+10||d.y<-20)swapRm(drops,i)}
  for(let i=gibs.length-1;i>=0;i--){const q=gibs[i];q.l--;
    if(q.stuck){q.x-=ss;if(q.stuck<0&&R()<.002){q.stuck=0;q.vy=.5}}
    else{q.vy+=g;q.vx*=.99;q.vy*=.99;q.x+=q.vx-ss*.45;q.y+=q.vy;q.rot+=q.vr;
      const wx=q.x+sc,f=floorAt(wx),c=ceilAt(wx),rad=q.s*.5;
      if(q.y+rad>=f){q.y=f-rad;addDecal(wx,f,q.s*.7,1);if(Math.abs(q.vy)>.5)sfx.squish();q.vy*=-.32;q.vx*=.55;q.vr*=.5;if(Math.abs(q.vy)<.6){q.stuck=1;q.vy=0;q.vx=0;q.vr=0}}
      else if(q.y-rad<=c){q.y=c+rad;addDecal(wx,c,q.s*.7,-1);q.vy=Math.abs(q.vy)*.3;q.vx*=.5;if(R()<.5){q.stuck=-1;q.vx=0;q.vy=0;q.vr=0}}}
    if(q.burning>0){q.burning--;if(R()<.7)spark(q.x,q.y,rr(-.3,.3),-rr(.4,1.3),ri(6,14),pick(FIRE))}
    if(q.bleed>0){q.bleed--;if(q.bleed%(q.k==='half'?1:3)===0)drop(q.x,q.y,q.vx*.3+rr(-.3,.3),q.vy*.3+rr(-.3,.3),q.k==='half'?1.6:1,R()<.4?1:0,80)}
    if(q.pts&&(q.k==='rope'||q.k==='eye')){const p=q.pts;p[0].x=q.x;p[0].y=q.y;const seg=q.k==='rope'?2.6:2.2;
      for(let j=1;j<p.length;j++){const a=p[j],vx=(a.x-a.px)*.94,vy=(a.y-a.py)*.94;a.px=a.x;a.py=a.y;a.x+=vx-ss*.45;a.y+=vy+g;
        const fl=floorAt(a.x+sc);if(a.y>fl)a.y=fl;const cl=ceilAt(a.x+sc);if(a.y<cl)a.y=cl}
      for(let it=0;it<2;it++)for(let j=1;j<p.length;j++){const a=p[j-1],b=p[j],dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy)||1,df=(dd-seg)/dd;
        if(j===1){b.x-=dx*df;b.y-=dy*df}else{a.x+=dx*df*.5;a.y+=dy*df*.5;b.x-=dx*df*.5;b.y-=dy*df*.5}}}
    if(q.l<=0||q.x<-40||q.x>W+40||q.y>H+40)swapRm(gibs,i)}
  for(let i=mists.length-1;i>=0;i--){const m=mists[i];m.l--;m.r+=m.vr;m.x-=ss*.5;if(m.l<=0)swapRm(mists,i)}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l--;s.x+=s.vx;s.y+=s.vy;s.vx*=.95;s.vy*=.95;if(s.l<=0)swapRm(sparks,i)}
  for(let i=flashes.length-1;i>=0;i--){if(--flashes[i].l<=0)swapRm(flashes,i)}
  for(let i=geysers.length-1;i>=0;i--){const q=geysers[i];q.l--;
    let x,y;if(q.att){if(q.att.dead){swapRm(geysers,i);continue}x=q.att.x+q.ox;y=q.att.y+q.oy}else{x=q.wx-sc;y=q.y}
    for(let k=0;k<q.rate;k++){const a=q.a+rr(-.25,.25),sp=rr(1.5,3.8)*(q.l/(q.l+30));drop(x,y,Math.cos(a)*sp,Math.sin(a)*sp,rr(1,1.8),q.c||(R()<.3?2:0),100)}
    if(q.l<=0)swapRm(geysers,i)}
  for(let i=splats.length-1;i>=0;i--){const s=splats[i];s.l--;for(const d of s.dr)d.len+=d.sp;if(s.l<=0)swapRm(splats,i)}
  for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];o.t++;o.l--;o.vx*=.94;o.vy*=.94;o.x+=o.vx-ss*.5;o.y+=o.vy;
    if(P&&P.alive&&o.t>14){const d=Math.sqrt(dist2(o.x,o.y,P.x,P.y))||1;if(d<90){const f=d<40?2.6:1.1;o.x+=(P.x-o.x)/d*f;o.y+=(P.y-o.y)/d*f}
      if(d<8){G.bio+=o.v;meta.bio+=o.v;sfx.squish();swapRm(orbs,i);continue}}
    if(o.l<=0||o.x<-10)swapRm(orbs,i)}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.l--;t.y-=.35;if(t.l<=0)swapRm(texts,i)}
}
const CARN=[[5,'MESSY'],[10,'GRISLY'],[20,'VISCERAL'],[35,'ABATTOIR'],[50,'MEAT GRINDER'],[75,'BEYOND THE GATE'],[100,'HELL IS SHIPWIDE']];

function hellFlash(){if(!SET.flashes)return;makeHell();G.hell=ri(3,5);G.glitch=Math.max(G.glitch,8);sfx.whisper()}
function updateAmbient(){
  const s=G.scroll,corr=AMT.corr(s),core=AMT.core(s);
  if(AU.lp&&G.t%30===0)AU.lp.frequency.setTargetAtTime(140+AMT.hull(s)*60+corr*80+core*220+(G.boss&&G.boss.phase===2?180:0),AU.c.currentTime,1.5);

      txt(mx?'GRAFTED':cost+' BIO',W-22,y+1,mx?'#4b5663':can?'#ffb0b0':'#5a3a3c','right')}
    menuBoxes.push({x:14,y:y-3,w:W-28,h:15,i,a:()=>{const z=it[i];z.back?leaveShop():buy(z.u)}})});
  const s=it[menuSel];if(s&&s.u)txt(s.u.desc,24,H-18,'#bfd6ee');else txt('Z/ENTER GRAFT   X/ESC LEAVE',24,H-18,'#5b6573');
}

function render(){
  menuBoxes=[];FLUSHED=0;EYEQ.length=0;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(state==='title'){drawTitle()}
  else if(state==='shop'){drawShop()}
  else{
    const shx=G.shx||0,shy=G.shy||0;
    ctx.save();ctx.translate(shx,shy);drawWorld();ctx.restore();
    drawSplats();ctx.save();ctx.translate(shx,shy);drawEShots();ctx.restore();postFX();drawHUD();
    if(state==='over')drawOver();
    if(state==='pause'){drawOverlay('PAUSED','THE SHIP IS STILL LISTENING','#9fb0c2');drawMenu(pauseItems(),W/2-70,130,140)}
  }
  ctx.restore();present();
}

// ---------------- loop ----------------
let acc=0,lastT=performance.now();
function frame(now){requestAnimationFrame(frame);acc+=Math.min(100,now-lastT);lastT=now;let n=0;while(acc>=1000/60&&n<5){acc-=1000/60;step();n++}if(n)render()}
function start(data){if(data&&data.meta&&data.meta.lv){meta=data.meta;hi=Math.max(hi,data.hi||0)}requestAnimationFrame(frame)}
window.claude?.hot?.snapshot?.(()=>({meta,hi}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # main runs finish (a cancel mid `gh release delete/create latest` would leave no latest)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # D33: a type error blocks CI
      - run: npm run typecheck
      - name: Unit + integration tests (vitest, tests/unit + tests/integration)
        run: npm run test:unit
      - run: npm run build
      # SUMMARY #12: the jump switch is dev only (main.ts gates jumpBoot on import.meta.env.DEV, which the build sets
      # false, so jumpBoot and parseJump shake out). Both markers live only there; jumpRun/jumpBlob may stay (flow.ts)
      - name: Jump switch absent from the production bundle
        run: |
          hits=$(grep -rlF -e 'unknown stage kind on layout' -e 'jump switch:' dist/ || true)
          if [ -n "$hits" ]; then echo "::error::jump-switch code shipped in: $hits"; exit 1; fi
          echo "jump switch markers: none in dist/"
      - name: Regression gate (sim state vs tools/harness.baseline.json)
        run: npm run test:regress

  android:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Optional stable signing so new builds update in place (saves survive). See README.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.GRODIUS_KEYSTORE_B64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/grodius.keystore"
          echo "GRODIUS_KEYSTORE=$RUNNER_TEMP/grodius.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          GRODIUS_KEYSTORE_PASSWORD: ${{ secrets.GRODIUS_KEYSTORE_PASSWORD }}
          GRODIUS_KEY_ALIAS: ${{ secrets.GRODIUS_KEY_ALIAS }}
          GRODIUS_KEY_PASSWORD: ${{ secrets.GRODIUS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/grodius.apk"

      # failed builds publish their log as a release asset (readable without Actions access)
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 gradle.log > ci.log 2>/dev/null || echo "no gradle log" > ci.log
          gh release delete ci-log --yes --cleanup-tag || true
          gh release create ci-log ci.log --prerelease --title "CI failure log" --notes "run ${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: grodius-apk-${{ github.run_number }}
          path: grodius.apk

      # Rolling "latest" release: open it on the phone and tap the APK to install.
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest grodius.apk --prerelease \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Sideload build from ${GITHUB_SHA::7}: $COMMIT_MSG"

  web:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages serves the gh-pages branch; replace its contents with the new build
      - name: Deploy to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
